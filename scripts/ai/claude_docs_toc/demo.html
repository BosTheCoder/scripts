<!doctype html>
<!-- Manual check: serve this folder (python3 -m http.server) and open demo.html.
     Expect a "Contents" panel top-right listing Title / One / One.a / Two / Three,
     "Three" appearing ~1s after load, no "Claude" in the "Two" entry,
     and the entry for the section you're scrolled to in bold. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Docs TOC demo</title>
  <style>
    body { margin: 0; background: #1f1e1d; color: #e8e6e3; font: 16px/1.6 serif; }
    .bar { position: sticky; top: 0; height: 48px; background: #1f1e1d; border-bottom: 1px solid #333; }
    .scroller { height: 100vh; overflow: auto; }
    .ProseMirror { max-width: 680px; margin: 0 auto; padding: 0 16px 60vh; }
    p { height: 70vh; }
  </style>
</head>
<body>
  <div class="scroller">
    <div class="bar"></div>
    <div class="ProseMirror" id="doc">
      <h1>Title</h1><p>Intro</p>
      <h2>One</h2><p>…</p>
      <h3>One.a</h3><p>…</p>
      <h2>Two<span contenteditable="false">Claude</span></h2><p>…</p>
    </div>
    <div class="ProseMirror"><p>comment box</p></div>
  </div>
  <script>
    setTimeout(() => document.getElementById('doc')
      .insertAdjacentHTML('beforeend', '<h2>Three</h2><p>…</p>'), 1000);
  </script>
  <script src="claude_docs_toc.user.js"></script>
</body>
</html>
